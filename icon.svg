<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#06122e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#06b6d4" stroke-width="8" stroke-opacity="0.4"/>
  
  <!-- Outer 3D Sound Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#06b6d4" stroke-width="4" stroke-dasharray="12 10" opacity="0.4"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#10b981" stroke-width="5" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="100" fill="#091428" stroke="url(#cyanGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Headphones & Soundwave Symbol -->
  <path d="M 160 270 A 96 96 0 0 1 352 270" fill="none" stroke="url(#cyanGrad)" stroke-width="20" stroke-linecap="round"/>
  <rect x="140" y="250" width="32" height="60" rx="12" fill="#06b6d4"/>
  <rect x="340" y="250" width="32" height="60" rx="12" fill="#10b981"/>
  
  <!-- Equalizer Center Spectrum -->
  <rect x="220" y="230" width="10" height="50" rx="5" fill="#a855f7"/>
  <rect x="238" y="210" width="10" height="90" rx="5" fill="#06b6d4"/>
  <rect x="256" y="190" width="10" height="130" rx="5" fill="#10b981"/>
  <rect x="274" y="210" width="10" height="90" rx="5" fill="#06b6d4"/>
  <rect x="292" y="230" width="10" height="50" rx="5" fill="#a855f7"/>
</svg>
